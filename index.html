<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ムイムイ・ダルメシアン</title>
    
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100vh;
            background-color: #e0f7fa; /* お散歩中のような爽やかな背景色 */
            overflow: hidden;
            
            /* スマホの標準操作（スクロール、ズーム、戻るスワイプ等）を完全シャットアウト */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 遊び方の説明テキスト */
        .instructions {
            position: absolute;
            bottom: 30px; width: 100%;
            text-align: center;
            color: #555; font-family: sans-serif;
            pointer-events: none;
            line-height: 1.6;
            z-index: 0;
        }

        /* 
           【高度な変形トリック】
           指の角度に合わせて伸ばすため、3層のラッパーを使用します。
           1. axis-rotator: 指と指の角度に合わせて回転
           2. scaler: X軸方向に伸ばし、Y軸方向に縮める（体積維持）
           3. counter-rotator: 犬本体が逆立ちしないように、元の角度に逆回転して戻す
        */
        #dog-positioner {
            position: absolute;
            left: 0; top: 0; width: 0; height: 0; /* 基準点は常に画面の左上。JSでTranslateして動かす */
            z-index: 10;
        }
        
        #dog-axis-rotator, #dog-scaler, #dog-counter-rotator, #dog-flipper {
            position: absolute;
            left: 0; top: 0; width: 0; height: 0;
        }

        /* ムイムイ終了時にバネのように元の形へ戻るトランジション */
        .spring-back {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 影をつけて立体感を出す */
        #dog-flipper {
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));
            transition: filter 0.2s;
        }
        .is-touched #dog-flipper {
            /* 持ち上げられた時のように影を濃く、遠くする */
            filter: drop-shadow(0 25px 25px rgba(0,0,0,0.25));
        }

        /* 共通設定（原点0,0を中心に配置） */
        .part {
            position: absolute;
            background-color: #fcfcfc; /* 基本の白 */
            border: 4px solid #222;    /* 2次元デフォルメ感のための太いフチ */
            box-sizing: border-box;
        }

        /* 胴体 */
        .body {
            width: 140px; height: 90px;
            left: -70px; top: -45px; /* 中心に寄せる */
            border-radius: 60px 60px 50px 50px;
            z-index: 5;
            overflow: hidden; /* ブチ模様がはみ出ないように */
        }

        /* 黒いブチ模様（ダルメシアンの特徴） */
        .spot {
            position: absolute;
            background-color: #222;
            border-radius: 50%;
        }
        .body .s1 { width: 35px; height: 25px; top: 10px; left: 15px; transform: rotate(15deg); }
        .body .s2 { width: 45px; height: 35px; top: 45px; right: 20px; border-radius: 40% 60% 70% 30%; }
        .body .s3 { width: 25px; height: 25px; bottom: 5px; left: 60px; }
        .body .s4 { width: 15px; height: 15px; top: 25px; right: 10px; }

        /* 頭 */
        .head {
            width: 90px; height: 90px;
            left: 15px; top: -85px;
            border-radius: 50%;
            z-index: 20;
        }
        .head .s5 { width: 30px; height: 40px; top: 10px; left: 10px; border-radius: 50% 30% 60% 40%; }
        
        /* 耳（黒） */
        .ear {
            width: 30px; height: 75px;
            background-color: #222;
            border-radius: 50% 50% 50% 50% / 20% 20% 80% 80%;
            top: -70px;
            border: none;
        }
        .ear.left { left: 15px; transform: rotate(20deg); z-index: 19; }
        .ear.right { left: 80px; transform: rotate(-20deg); z-index: 21; }

        /* 顔のパーツ */
        .eye {
            position: absolute;
            width: 12px; height: 12px;
            background-color: #222;
            border-radius: 50%;
            top: 40px;
            transition: transform 0.2s;
        }
        .eye.left { left: 25px; }
        .eye.right { left: 55px; }
        .nose {
            position: absolute;
            width: 18px; height: 12px;
            background-color: #222;
            border-radius: 50% 50% 60% 60%;
            top: 55px; left: 36px;
        }

        /* 触られている時は目を細める */
        .is-touched .eye { transform: scaleY(0.15); }

        /* 赤い首輪（ワンポイント） */
        .collar {
            position: absolute;
            width: 60px; height: 16px;
            background-color: #e63946;
            border: 4px solid #222;
            border-radius: 10px;
            left: 20px; top: -30px;
            transform: rotate(15deg);
            z-index: 15;
            box-sizing: border-box;
        }
        .collar-tag {
            position: absolute;
            width: 16px; height: 16px;
            background-color: #ffd166;
            border: 3px solid #222;
            border-radius: 50%;
            top: 8px; left: 25px;
        }

        /* 尻尾 */
        .tail {
            width: 50px; height: 20px;
            left: -110px; top: -35px;
            border-radius: 20px 0 0 20px;
            transform-origin: right center;
            z-index: 3;
        }

        /* 脚 */
        .leg {
            width: 24px; height: 45px;
            border-radius: 12px;
            top: 25px;
            transform-origin: center top;
        }
        .leg.back-left { left: -50px; z-index: 4; }
        .leg.back-right { left: -30px; z-index: 6; }
        .leg.front-left { left: 30px; z-index: 4; }
        .leg.front-right { left: 50px; z-index: 6; }

        /* 脚の細かいブチ */
        .leg::after {
            content: ''; position: absolute;
            width: 8px; height: 8px; background: #222;
            border-radius: 50%; top: 15px; left: 4px;
        }

        /* アイドル状態の歩行アニメーション */
        @keyframes walk-front {
            0% { transform: rotate(-25deg); }
            100% { transform: rotate(25deg); }
        }
        @keyframes walk-back {
            0% { transform: rotate(25deg); }
            100% { transform: rotate(-25deg); }
        }
        @keyframes wag {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(30deg); }
        }

        /* 歩いている時だけアニメーションを適用 */
        .is-walking .leg.front-left, .is-walking .leg.back-right { animation: walk-front 0.4s infinite alternate ease-in-out; }
        .is-walking .leg.front-right, .is-walking .leg.back-left { animation: walk-back 0.4s infinite alternate ease-in-out; }
        .is-walking .tail { animation: wag 0.3s infinite alternate ease-in-out; }

        /* 持ち上げられた時は足がだらんと下がる */
        .is-touched .leg { transform: rotate(10deg); transition: transform 0.2s; }
        .is-touched .tail { transform: rotate(0deg); }
        
    </style>
</head>
<body>

    <!-- 遊び方ガイド -->
    <div class="instructions">
        【ムイムイ・ダルメシアン】<br>
        1本指：つかんで移動<br>
        2本指：つまんで引っ張る（ムイムイ！）
    </div>

    <div id="dog-positioner" class="is-walking">
        <!-- 指の角度に合わせて回転する層 -->
        <div id="dog-axis-rotator">
            <!-- X/Yに伸縮する層（ここでゴムのような変形を作る） -->
            <div id="dog-scaler" class="spring-back">
                <!-- 逆回転して犬を直立に保つ層 -->
                <div id="dog-counter-rotator">
                    <!-- 進行方向に向かって反転する層 -->
                    <div id="dog-flipper">
                        
                        <!-- 犬のパーツ群 -->
                        <div class="part tail"></div>
                        
                        <div class="part leg back-left"></div>
                        <div class="part leg back-right"></div>
                        
                        <div class="part body">
                            <div class="spot s1"></div>
                            <div class="spot s2"></div>
                            <div class="spot s3"></div>
                            <div class="spot s4"></div>
                        </div>
                        
                        <div class="collar"><div class="collar-tag"></div></div>
                        
                        <div class="part leg front-left"></div>
                        <div class="part leg front-right"></div>
                        
                        <div class="part ear left"></div>
                        <div class="part ear right"></div>
                        <div class="part head">
                            <div class="eye left"></div>
                            <div class="eye right"></div>
                            <div class="nose"></div>
                            <div class="spot s5"></div>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM要素の取得
        const positioner = document.getElementById('dog-positioner');
        const axisRotator = document.getElementById('dog-axis-rotator');
        const scaler = document.getElementById('dog-scaler');
        const counterRotator = document.getElementById('dog-counter-rotator');
        const flipper = document.getElementById('dog-flipper');

        // 犬の位置と状態
        let dogX = window.innerWidth / 2;
        let dogY = window.innerHeight / 2;
        let flipX = 1;
        let touchState = 0; // 0: 離している, 1: 1本指(ドラッグ), 2: 2本指(ムイムイ)

        // ドラッグ用のオフセット
        let dragOffsetX = 0, dragOffsetY = 0;

        // ピンチ（ムイムイ）用の状態
        let baseDist = 1;
        let pinchOffsetX = 0, pinchOffsetY = 0;

        // 徘徊（お散歩）用の状態
        let isWandering = true;
        let targetX = dogX;
        let targetY = dogY;
        let resumeWanderTimer = null;

        // 初期位置の設定
        positioner.style.transform = `translate(${dogX}px, ${dogY}px)`;

        // --- タッチイベント処理 ---
        const touchOptions = { passive: false };

        document.addEventListener('touchstart', (e) => {
            e.preventDefault(); // 画面スクロール等を完全に禁止
            
            // 触られたらお散歩を一時停止
            isWandering = false;
            clearTimeout(resumeWanderTimer);
            positioner.classList.remove('is-walking');
            positioner.classList.add('is-touched');

            if (e.touches.length === 1) {
                // 1本指：ドラッグモード
                touchState = 1;
                dragOffsetX = dogX - e.touches[0].clientX;
                dragOffsetY = dogY - e.touches[0].clientY;
                
                // 変形をリセット（即座に戻すためにspring-backを付与）
                scaler.classList.add('spring-back');
                scaler.style.transform = `scale(1, 1)`;
                
            } else if (e.touches.length === 2) {
                // 2本指：ムイムイ（ピンチ）モード
                touchState = 2;
                
                // バネの動きを消して指に完全追従させる
                scaler.classList.remove('spring-back');
                
                // 2本指の中間点を計算（ここを中心に引っ張れるようにする）
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                pinchOffsetX = dogX - midX;
                pinchOffsetY = dogY - midY;
                
                // 初期距離を記録
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                baseDist = Math.hypot(dx, dy) || 1;
            }
        }, touchOptions);

        document.addEventListener('touchmove', (e) => {
            e.preventDefault();

            if (touchState === 1 && e.touches.length === 1) {
                // ドラッグ処理：指に合わせて位置を移動
                dogX = e.touches[0].clientX + dragOffsetX;
                dogY = e.touches[0].clientY + dragOffsetY;
                positioner.style.transform = `translate(${dogX}px, ${dogY}px)`;
                
            } else if (touchState === 2 && e.touches.length >= 2) {
                // ムイムイ処理：指に合わせて位置・角度・伸縮を計算
                
                // 位置の移動（2本指の中間点についてくる）
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                dogX = midX + pinchOffsetX;
                dogY = midY + pinchOffsetY;
                positioner.style.transform = `translate(${dogX}px, ${dogY}px)`;

                // 2本指の距離と角度を計算
                const dx = e.touches[1].clientX - e.touches[0].clientX;
                const dy = e.touches[1].clientY - e.touches[0].clientY;
                const currentDist = Math.hypot(dx, dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI); // 角度（度数法）

                // 伸びる割合を計算 (0.4倍 〜 最大2.5倍 まで制限)
                let stretchX = currentDist / baseDist;
                stretchX = Math.max(0.4, Math.min(stretchX, 2.5));
                
                // 体積を維持するための計算（Xが伸びたらYは縮む）
                const stretchY = 1 / stretchX;

                // 【変形マジックの適用】
                // 1. 指の角度に全体を向ける
                axisRotator.style.transform = `rotate(${angle}deg)`;
                // 2. その角度に向かってX/Yを伸縮させる
                scaler.style.transform = `scale(${stretchX}, ${stretchY})`;
                // 3. 犬の絵自体が回転してしまわないよう、中身だけ逆回転させる
                counterRotator.style.transform = `rotate(${-angle}deg)`;
            }
        }, touchOptions);

        const endTouch = (e) => {
            e.preventDefault();
            
            if (e.touches.length === 0) {
                // 全ての指が離れた時：ポヨンと元に戻る
                touchState = 0;
                positioner.classList.remove('is-touched');
                
                // 伸縮を1倍に戻す（角度は維持したままなので、自然に縮むように見えます）
                scaler.classList.add('spring-back');
                scaler.style.transform = `scale(1, 1)`;

                // 数秒後に自動でお散歩を再開
                resumeWanderTimer = setTimeout(() => {
                    targetX = dogX;
                    targetY = dogY;
                    isWandering = true;
                    positioner.classList.add('is-walking');
                }, 1500);

            } else if (e.touches.length === 1) {
                // 2本指から1本指になった時（ドラッグにシームレスに移行）
                touchState = 1;
                dragOffsetX = dogX - e.touches[0].clientX;
                dragOffsetY = dogY - e.touches[0].clientY;
                
                scaler.classList.add('spring-back');
                scaler.style.transform = `scale(1, 1)`;
            }
        };

        document.addEventListener('touchend', endTouch, touchOptions);
        document.addEventListener('touchcancel', endTouch, touchOptions);


        // --- お散歩（徘徊）アニメーションループ ---
        function wander() {
            if (isWandering) {
                const dx = targetX - dogX;
                const dy = targetY - dogY;
                const dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    // 目的地に到着したら、画面内のランダムな新しい場所を目的地に設定
                    const padding = 100;
                    targetX = padding + Math.random() * (window.innerWidth - padding * 2);
                    targetY = padding + Math.random() * (window.innerHeight - padding * 2);
                } else {
                    // 目的地に向かってトコトコ歩く
                    const speed = 1.0;
                    dogX += (dx / dist) * speed;
                    dogY += (dy / dist) * speed;
                    
                    // 進んでいる方向（左右）に合わせて反転させる
                    flipX = dx > 0 ? 1 : -1;
                    flipper.style.transform = `scaleX(${flipX})`;
                    
                    // 位置を更新
                    positioner.style.transform = `translate(${dogX}px, ${dogY}px)`;
                }
            }
            // 次のフレームを要求
            requestAnimationFrame(wander);
        }

        // お散歩開始
        wander();

    </script>
</body>
</html>
