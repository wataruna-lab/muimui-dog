<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホでの拡大縮小を禁止 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ワンちゃんムイムイ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #fdf6e3; /* 優しいクリーム色の背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            
            /* CRITICAL: ブラウザ標準のタッチ操作（スクロール、ズームなど）を完全に無効化 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ワンちゃん全体を包むコンテナ */
        #dog-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* コンテナ自身もタッチ操作のデフォルトを無効化 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            
            /* 変形時の基準点を中央下部に（ジャンプなどを自然にするため） */
            transform-origin: center bottom;
        }

        /* 体 */
        .body {
            position: absolute;
            width: 160px;
            height: 140px;
            background-color: #f4a460; /* 柴犬のような茶色 */
            border-radius: 50% 50% 45% 45%;
            box-shadow: inset -10px -15px 20px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15);
            z-index: 2;
        }

        /* 耳 */
        .ear {
            position: absolute;
            width: 60px;
            height: 80px;
            background-color: #d2691e;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 20px;
            z-index: 1;
        }
        .ear.left {
            left: -15px;
            transform: rotate(-30deg);
        }
        .ear.right {
            right: -15px;
            transform: rotate(30deg);
        }

        /* 顔パーツのコンテナ */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        /* 目 */
        .eye {
            position: absolute;
            top: 55px;
            width: 14px;
            height: 14px;
            background-color: #333;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .eye.left { left: 40px; }
        .eye.right { right: 40px; }

        /* 鼻 */
        .nose {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 16px;
            background-color: #222;
            border-radius: 50% 50% 60% 60%;
        }

        /* パン操作時（なでなで）の笑顔状態 */
        .is-happy .eye {
            height: 4px; /* 目が細くなる */
            border-radius: 10px;
            transform: translateY(5px);
        }

        /* トランジション（バネのような滑らかな戻り） */
        .spring-back {
            /* cubic-bezierを使って、ぽよんと弾むような戻り方を実現 */
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* タップ時のジャンプアニメーション */
        @keyframes jump {
            0%   { transform: translateY(0) scale(1, 1); }
            30%  { transform: translateY(-30px) scale(0.9, 1.1); }
            60%  { transform: translateY(0) scale(1.05, 0.95); }
            100% { transform: translateY(0) scale(1, 1); }
        }
        .is-jumping {
            animation: jump 0.5s ease-out;
        }

        /* 遊び方テキスト */
        .instructions {
            position: absolute;
            bottom: 30px;
            color: #888;
            font-family: sans-serif;
            text-align: center;
            line-height: 1.5;
            pointer-events: none; /* テキストへのタッチを無効化 */
        }
    </style>
</head>
<body>

    <div id="dog-container" class="spring-back">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="body" id="dog-body">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
            </div>
        </div>
    </div>

    <div class="instructions">
        タップ：ジャンプ<br>
        なぞる（パン）：気持ちよくて目を細める<br>
        つまむ・広げる（ピンチ）：伸び縮みする<br>
        弾く（スワイプ）：スライディング
    </div>

    <script>
        const dogContainer = document.getElementById('dog-container');
        const dogBody = document.getElementById('dog-body');

        // Hammerインスタンスを作成。デフォルトでtap, doubletap, pan, swipe, pressが有効
        const mc = new Hammer(dogContainer);

        // CRITICAL: ピンチ（つまむ・広げる）はデフォルトで無効なので、明示的に有効化する
        mc.get('pinch').set({ enable: true });

        // ジェスチャー状態を管理する変数
        let currentScale = 1;

        // 共通：操作が終わった時に元の位置・形にバネのように戻す関数
        function resetDog() {
            dogContainer.classList.add('spring-back');
            dogContainer.style.transform = `translate(0px, 0px) scale(1)`;
            dogBody.classList.remove('is-happy');
        }

        // 1. タップ：軽くジャンプする
        mc.on('tap', function(ev) {
            // クラスを付け直すことでアニメーションを再実行
            dogContainer.classList.remove('is-jumping');
            void dogContainer.offsetWidth; // リフローを強制
            dogContainer.classList.add('is-jumping');
        });

        // 2. パン（なでなで）：目を細めて幸せそうにする
        mc.on('panstart panmove', function(ev) {
            // スワイプとの競合を防ぐため、ゆっくりなぞった時だけ反応
            dogBody.classList.add('is-happy');
            
            // 指に合わせて少しだけ位置をずらす（ムイムイ感）
            dogContainer.classList.remove('spring-back');
            const moveX = ev.deltaX * 0.3;
            const moveY = ev.deltaY * 0.3;
            dogContainer.style.transform = `translate(${moveX}px, ${moveY}px) scale(${currentScale})`;
        });

        mc.on('panend pancancel', function(ev) {
            resetDog();
        });

        // 3. ピンチ（つまむ・広げる）：スケールを変える
        mc.on('pinchstart pinchmove', function(ev) {
            dogContainer.classList.remove('spring-back');
            
            // event.scale を使って大きさを変更
            currentScale = ev.scale;
            
            // 極端に大きくなったり小さくなったりしないよう制限
            if (currentScale < 0.4) currentScale = 0.4;
            if (currentScale > 2.5) currentScale = 2.5;
            
            dogContainer.style.transform = `scale(${currentScale})`;
        });

        mc.on('pinchend pinchcancel', function(ev) {
            currentScale = 1;
            resetDog();
        });

        // 4. スワイプ（フリック）：弾き飛ばされて戻ってくる
        mc.on('swipe', function(ev) {
            dogContainer.classList.remove('spring-back');
            
            // 弾かれた方向へ大きくスライド（translateX/Y）
            const force = 300; 
            const slideX = ev.velocityX * force;
            const slideY = ev.velocityY * force;
            
            // スピード感を出すためにトランジションを上書き
            dogContainer.style.transition = 'transform 0.2s ease-out';
            dogContainer.style.transform = `translate(${slideX}px, ${slideY}px)`;
            
            // 少し経ったら中央にポヨンと戻る
            setTimeout(() => {
                dogContainer.style.transition = ''; // カスタムトランジションを消す
                resetDog(); // spring-back クラスのトランジションで戻る
            }, 250);
        });

    </script>
</body>
</html>
