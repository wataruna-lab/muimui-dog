<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ワンちゃんムイムイ アプリ (プロトタイプ)</title>
    <!-- ジェスチャー操作を簡単にするライブラリ Hammer.js を読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #e0f7fa; /* リラックスできる優しい背景色 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 画面外のスクロールを禁止 */
            /* スマホでのデフォルトのスクロールやズームを完全に無効化し、アプリの操作に専念させる */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ワンちゃんのコンテナ */
        #dog-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 普段はゆっくりと呼吸しているようなアニメーション */
            animation: breathe 3s infinite ease-in-out;
        }

        /* アニメーション付きで元の位置・形に戻るためのクラス（バネのような動き） */
        .spring-back {
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ワンちゃんの体（おもちのような形） */
        .dog-body {
            position: relative;
            width: 200px;
            height: 160px;
            background-color: #f5deb3; /* 優しいクリーム色 */
            border-radius: 45% 45% 40% 40% / 50% 50% 45% 45%; /* 少し潰れた丸 */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), inset -10px -10px 20px rgba(0,0,0,0.05);
        }

        /* 耳 */
        .ear {
            position: absolute;
            width: 70px;
            height: 90px;
            background-color: #deb887; /* 少し濃い茶色 */
            border-radius: 50%;
            top: 20px;
            z-index: -1;
        }
        .ear.left {
            left: -20px;
            transform: rotate(-30deg);
        }
        .ear.right {
            right: -20px;
            transform: rotate(30deg);
        }

        /* 顔のパーツ群 */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none; /* 顔パーツ自体がタッチを邪魔しないようにする */
        }

        /* 目 */
        .eye {
            position: absolute;
            top: 60px;
            width: 12px;
            height: 12px;
            background-color: #333;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .eye.left { left: 55px; }
        .eye.right { right: 55px; }

        /* 鼻 */
        .nose {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 14px;
            background-color: #4a3b32;
            border-radius: 50% 50% 40% 40%;
        }

        /* ほっぺた */
        .cheek {
            position: absolute;
            top: 70px;
            width: 25px;
            height: 15px;
            background-color: rgba(255, 105, 180, 0.4);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .cheek.left { left: 30px; }
        .cheek.right { right: 30px; }

        /* なでられた時の「嬉しい顔」状態 */
        .is-happy .eye {
            height: 0px;
            width: 16px;
            border-top: 4px solid #333;
            background-color: transparent;
            border-radius: 50%;
            margin-top: 6px;
        }
        .is-happy .cheek {
            opacity: 1;
        }

        /* タップされた時のアニメーション */
        @keyframes bounceTap {
            0% { transform: scale(1); }
            30% { transform: scale(0.9, 1.1) translateY(-10px); }
            60% { transform: scale(1.05, 0.95) translateY(5px); }
            100% { transform: scale(1) translateY(0); }
        }
        .is-bouncing {
            animation: bounceTap 0.4s ease-out;
        }

        /* 待機中の呼吸アニメーション */
        @keyframes breathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.02, 0.98); }
            100% { transform: scale(1); }
        }

        /* 遊び方の説明テキスト */
        .instruction {
            position: absolute;
            bottom: 40px;
            text-align: center;
            color: #555;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div id="dog-container" class="spring-back">
        <div class="dog-body" id="dog-body">
            <!-- 左耳・右耳 -->
            <div class="ear left"></div>
            <div class="ear right"></div>
            <!-- 顔 -->
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
            </div>
        </div>
    </div>

    <div class="instruction">
        タップ・なでる（スワイプ）<br>
        つまむ（ピンチ）・弾く（フリック）<br>
        で遊んでみてね！
    </div>

    <script>
        const dogContainer = document.getElementById('dog-container');
        const dogBody = document.getElementById('dog-body');
        
        // 変形の状態を保持する変数
        let transformState = {
            x: 0,
            y: 0,
            scale: 1
        };

        // Hammer.jsのインスタンスを作成
        const mc = new Hammer.Manager(dogContainer);

        // 認識したいジェスチャーを追加・設定
        // パン（なでる、引きずる）: 全方向許可
        mc.add(new Hammer.Pan({ direction: Hammer.DIRECTION_ALL, threshold: 0 }));
        // ピンチ（つまむ、広げる）: デフォルトでは無効なので有効化
        mc.add(new Hammer.Pinch({ enable: true }));
        // スワイプ（弾く）: 全方向許可
        mc.add(new Hammer.Swipe({ direction: Hammer.DIRECTION_ALL }));
        // タップ
        mc.add(new Hammer.Tap({ taps: 1 }));

        // ピンチとパンを同時に認識できるように設定
        mc.get('pinch').recognizeWith(mc.get('pan'));

        // ワンちゃんの見た目（位置・サイズ）を更新する関数
        function updateTransform() {
            const transformString = `translate(${transformState.x}px, ${transformState.y}px) scale(${transformState.scale})`;
            dogContainer.style.transform = transformString;
        }

        // 定位置・元の形に戻す関数
        function resetDog() {
            transformState.x = 0;
            transformState.y = 0;
            transformState.scale = 1;
            
            // バネのように戻るアニメーションクラスを付与
            dogContainer.classList.add('spring-back');
            dogBody.classList.remove('is-happy');
            
            updateTransform();
        }

        // 1. タップ（ちょんっ）
        mc.on('tap', function(ev) {
            // アニメーションを再スタートさせるための処理
            dogContainer.classList.remove('is-bouncing');
            void dogContainer.offsetWidth; // リフローを強制してアニメーションをリセット
            dogContainer.classList.add('is-bouncing');
            
            // 少しの間だけ嬉しい顔になる
            dogBody.classList.add('is-happy');
            setTimeout(() => {
                dogBody.classList.remove('is-happy');
            }, 500);
        });

        // 2. パン（なでる、引っ張る）
        mc.on('panstart panmove', function(ev) {
            // 操作中は戻るアニメーションを切る（指に吸い付かせるため）
            dogContainer.classList.remove('spring-back');
            
            // 撫でられているので嬉しい顔にする
            dogBody.classList.add('is-happy');

            // 指の動きに合わせて少しだけ動く（追従しすぎないように減衰させる）
            transformState.x = ev.deltaX * 0.4;
            transformState.y = ev.deltaY * 0.4;
            updateTransform();
        });

        mc.on('panend pancancel', function(ev) {
            // 指が離れたら元に戻す
            resetDog();
        });

        // 3. ピンチ（つまむ・広げる）
        mc.on('pinchstart pinchmove', function(ev) {
            dogContainer.classList.remove('spring-back');
            
            // スケールを指の間隔に合わせる（極端に小さく/大きくならないように制限）
            let newScale = ev.scale;
            if (newScale < 0.5) newScale = 0.5; // 最小サイズ
            if (newScale > 2.0) newScale = 2.0; // 最大サイズ
            
            transformState.scale = newScale;
            updateTransform();
        });

        mc.on('pinchend pinchcancel', function(ev) {
            resetDog();
        });

        // 4. スワイプ・フリック（弾く）
        mc.on('swipe', function(ev) {
            dogContainer.classList.remove('spring-back');
            
            // 弾かれた方向に大きく吹き飛ぶ（速度に比例）
            const force = Math.min(Math.abs(ev.velocity) * 150, 400); 
            transformState.x = ev.velocityX * force;
            transformState.y = ev.velocityY * force;
            
            // びっくりした顔（今回は嬉しい顔の解除）
            dogBody.classList.remove('is-happy');
            updateTransform();

            // 少し経ったら猛ダッシュで元の位置に戻ってくる
            setTimeout(() => {
                resetDog();
            }, 300);
        });

    </script>
</body>
</html>
