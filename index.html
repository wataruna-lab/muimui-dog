<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- ズーム等の無効化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>純生ムイムイ犬</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #fdf6e3;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            
            /* ブラウザ標準のタッチ操作を完全に禁止 */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #dog-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            /* JSで動かしている間はtransitionを切り、離した時に付与する */
        }

        /* 指を離した時のぽよんと戻る動き */
        .spring-back {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* タッチ中の縮み（タップ反応） */
        .is-touched .body {
            transform: scale(0.95, 0.9); /* 少し潰れる */
            transition: transform 0.1s;
        }

        .body {
            position: absolute;
            width: 160px;
            height: 140px;
            background-color: #f4a460;
            border-radius: 50% 50% 45% 45%;
            box-shadow: inset -10px -15px 20px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.15);
            z-index: 2;
            transition: transform 0.3s; /* 通常時の戻り */
        }

        .ear {
            position: absolute;
            width: 60px;
            height: 80px;
            background-color: #d2691e;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 20px;
            z-index: 1;
        }
        .ear.left { left: -10px; transform: rotate(-30deg); }
        .ear.right { right: -10px; transform: rotate(30deg); }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .eye {
            position: absolute;
            top: 55px;
            width: 14px;
            height: 14px;
            background-color: #333;
            border-radius: 50%;
            transition: all 0.1s ease;
        }
        .eye.left { left: 40px; }
        .eye.right { right: 40px; }

        .nose {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 16px;
            background-color: #222;
            border-radius: 50% 50% 60% 60%;
        }

        /* タッチ中（なでられ中）は目を細める */
        .is-touched .eye {
            height: 4px;
            border-radius: 10px;
            transform: translateY(5px);
        }

        /* 遊び方テキスト */
        .instructions {
            position: absolute;
            bottom: 30px;
            color: #888;
            font-family: sans-serif;
            text-align: center;
            line-height: 1.5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="dog-container" class="spring-back">
        <div class="ear left"></div>
        <div class="ear right"></div>
        <div class="body">
            <div class="face">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
            </div>
        </div>
    </div>

    <div class="instructions">
        【スマホ専用】<br>
        1本指：なでる（少し動く・目を細める）<br>
        2本指：つまむ・広げる（伸び縮みする）
    </div>

    <script>
        const container = document.getElementById('dog-container');
        
        let startX = 0;
        let startY = 0;
        let initialDistance = 0;
        let currentScale = 1;
        let baseScale = 1; // ピンチ開始時のスケールを保持

        // 2点間の距離を計算する関数（ピタゴラスの定理）
        function MathHypot(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // イベントオプション：passive: falseを指定し、preventDefaultを使えるようにする
        const touchOptions = { passive: false };

        container.addEventListener('touchstart', (e) => {
            e.preventDefault(); // デフォルトのスクロールやズームを強制停止
            
            // 指が触れたらバネのアニメーションを切り、即座に形が変わるようにする
            container.classList.remove('spring-back');
            container.classList.add('is-touched');
            
            if (e.touches.length === 1) {
                // 1本指の場合：位置を記録
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                // 2本指の場合：2点間の初期距離を記録
                initialDistance = MathHypot(e.touches);
                baseScale = currentScale;
            }
        }, touchOptions);

        container.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 1) {
                // 1本指：なでる動き（指に合わせて少し追従して傾く）
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                
                // 動く量を半分にして「引っ張られている」感を出す
                const moveX = dx * 0.5;
                const moveY = dy * 0.5;
                // X軸の移動に合わせて少し回転させる
                const rotate = dx * 0.1;
                
                container.style.transform = `translate(${moveX}px, ${moveY}px) rotate(${rotate}deg) scale(${currentScale})`;
                
            } else if (e.touches.length === 2) {
                // 2本指：ピンチイン・ピンチアウト
                if (initialDistance > 0) {
                    const currentDistance = MathHypot(e.touches);
                    // 初期距離との比率でスケールを計算
                    currentScale = baseScale * (currentDistance / initialDistance);
                    
                    // スケールを 0.5倍 〜 2.5倍 の間に制限
                    currentScale = Math.max(0.5, Math.min(currentScale, 2.5));
                    
                    container.style.transform = `scale(${currentScale})`;
                }
            }
        }, touchOptions);

        const endTouch = (e) => {
            e.preventDefault();
            
            if (e.touches.length === 0) {
                // 全ての指が離れたら、ぽよんと元の位置・大きさに戻す
                container.classList.remove('is-touched');
                container.classList.add('spring-back');
                
                currentScale = 1;
                container.style.transform = `translate(0px, 0px) rotate(0deg) scale(1)`;
                
            } else if (e.touches.length === 1) {
                // 2本指から1本指になった場合、残った指を始点として再設定
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        };

        container.addEventListener('touchend', endTouch, touchOptions);
        container.addEventListener('touchcancel', endTouch, touchOptions);

    </script>
</body>
</html>
